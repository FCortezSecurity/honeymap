x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  environment:
    DB_HOST: db
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    GEOIP_CITY_DB: /geoip/dbip-city-lite.mmdb
    GEOIP_ASN_DB: /geoip/dbip-asn-lite.mmdb
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  canary:
    build: ./docker/opencanary
    volumes:
      - ./docker/opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - ./data/logs:/var/log/opencanary
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:2121:2121"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: honeymap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: honeymap
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeymap -d honeymap"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    <<: *app
    command: python run_ingest.py /data/logs/opencanary.log --follow
    volumes:
      - ./data/logs:/data/logs:ro
      - ./data/geoip:/geoip:ro

  dashboard:
    <<: *app
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    volumes:
      - ./data/geoip:/geoip:ro
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  pgdata: